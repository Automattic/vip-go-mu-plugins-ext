name: Package Plugin

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  package:
    name: Build and Package
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      startsWith(github.head_ref, 'release/')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build:prod

      - name: Determine version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create distribution directory
        run: |
          mkdir -p dist/vip-agentforce
          
          # Copy all files except those in .distignore
          rsync -av --exclude-from='.distignore' ./ dist/vip-agentforce/
          
          # Remove .distignore from the distribution
          rm -f dist/vip-agentforce/.distignore

      - name: Create zip archive
        run: |
          cd dist
          zip -r vip-agentforce.zip vip-agentforce

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vip-agentforce-${{ steps.version.outputs.version }}
          path: dist/vip-agentforce.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: dist/vip-agentforce.zip
          generate_release_notes: true
