name: Deploy to WordPress.org

# Triggered by the tag, not by `release: [released]`, because release.yml
# publishes the release with the default GITHUB_TOKEN, and events raised by the
# GITHUB_TOKEN do not start further workflow runs. A release-typed trigger would
# therefore never fire, and silently: no run appears at all. See
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow
#
# workflow_dispatch is the escape hatch: it can dry-run against SVN before a
# real deploy, and can push a tag that was cut before this workflow existed.
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. 2.0.0)'
        required: true
      dry_run:
        description: 'Build and diff against SVN without committing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}

jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether this tag ships to WordPress.org
        id: gate
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu

          VERSION="${TAG#v}"

          # This value is interpolated into checkout's `ref:`, and on
          # workflow_dispatch it is free text. Constrain it to a version.
          case "$VERSION" in
            *[!0-9A-Za-z.-]* | '' )
              echo "::error::'${VERSION}' is not a valid version tag"
              exit 1
              ;;
          esac

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # A hyphen marks a pre-release (2.0.0-RC1). WordPress.org has no
          # concept of one: an SVN tag there is immediately installable.
          case "$VERSION" in
            *-*)
              echo "ship=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${VERSION} is a pre-release; skipping WordPress.org."
              ;;
            *)
              echo "ship=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check out the tag
        if: steps.gate.outputs.ship == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.gate.outputs.version }}
          persist-credentials: false

      - name: Check the plugin version and Stable tag match the tag
        if: steps.gate.outputs.ship == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -eu

          HEADER="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' shareadraft.php | head -n1 | tr -d '[:space:]')"
          CONSTANT="$(sed -n "s/.*VIP_SHAREADRAFT_VERSION'[^']*'\([^']*\)'.*/\1/p" shareadraft.php | head -n1)"
          # WordPress.org serves whatever Stable tag points at, so a stale one
          # silently publishes the previous release under the new version.
          STABLE="$(sed -n 's/^\*\*Stable tag:\*\*[[:space:]]*//p' README.md | head -n1 | tr -d '[:space:]')"

          # release.yml checks the first two as well, but runs in parallel, so
          # its failure would not stop this deploy.
          FAILED=0
          for pair in "plugin header:${HEADER}" "VIP_SHAREADRAFT_VERSION:${CONSTANT}" "README.md Stable tag:${STABLE}"; do
            if [ "${pair#*:}" != "$VERSION" ]; then
              echo "::error::${pair%%:*} is '${pair#*:}' but the tag is '${VERSION}'"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ]

      - name: Set up Node.js
        if: steps.gate.outputs.ship == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          # No dependency cache: a poisoned cache would ship straight to SVN.
          package-manager-cache: false

      - name: Build editor assets
        if: steps.gate.outputs.ship == 'true'
        run: |
          npm ci
          npm run build

          # An empty build/ would ship a plugin whose editor panel and admin
          # select-all silently never load, so fail loudly here instead.
          for f in build/index.js build/index.asset.php build/admin.js build/admin.asset.php; do
            if [ ! -s "$f" ]; then
              echo "::error::npm run build did not produce $f"
              exit 1
            fi
          done

      - name: Deploy
        if: steps.gate.outputs.ship == 'true'
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: ${{ inputs.dry_run || false }}
        env:
          # Hardcoded rather than taken from the repository name, which has
          # already changed once (live-previews).
          SLUG: shareadraft
          VERSION: ${{ steps.gate.outputs.version }}
          # Exclusions come from .distignore, the same list release.yml builds
          # the ZIP from; screenshots, banners and icons come from
          # .wordpress-org/. Both rsyncs run with --delete, so anything missing
          # locally is removed from SVN.
          ASSETS_DIR: .wordpress-org
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
