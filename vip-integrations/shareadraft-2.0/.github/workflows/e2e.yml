name: Run E2E tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.9', '7.1']
    name: E2E Tests on WordPress ${{ matrix.wordpress }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        env:
          fail-fast: 'true'

      - name: Install PHP Dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
  
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      # build/ is not committed; the dev-env bind-mounts this checkout, so the
      # editor panel and admin scripts only exist if we build them here.
      - name: Build plugin assets
        run: npm run build

      - name: Install Playwright dependencies
        timeout-minutes: 10
        run: sudo -E npx playwright install-deps chrome

      - name: Install VIP CLI
        # Pinned, and Dependabot cannot see it, so bump it by hand.
        run: npm install -g @automattic/vip@4.1.5

      - name: Create development environment
        run: vip dev-env create --wordpress ${{ matrix.wordpress }} < /dev/null

      - name: Start development environment
        run: vip dev-env start --slug shareadraft --skip-wp-versions-check

      - name: Update user password
        run: vip dev-env exec -- wp user update vipgo --user_pass=password

      # The classic-screen journey needs the Classic Editor plugin. Keeping the
      # block editor as the default, but letting users switch, means only the
      # test that asks for ?classic-editor gets the classic screen.
      - name: Install Classic Editor
        run: |
          vip dev-env exec -- wp plugin install classic-editor --activate
          vip dev-env exec -- wp option update classic-editor-replace block
          vip dev-env exec -- wp option update classic-editor-allow-users allow

      - name: Run E2E tests
        run: npm test
        env:
          E2E_URL: http://shareadraft.vipdev.lndo.site/

      - name: Archive test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results
          path: .playwright
          retention-days: 7
